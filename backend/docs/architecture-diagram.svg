<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <!-- Background -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#080816"/>
    </radialGradient>
    <linearGradient id="redBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0e1a"/>
      <stop offset="100%" stop-color="#2b0e1e"/>
    </linearGradient>
    <linearGradient id="greenBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1f1e"/>
      <stop offset="100%" stop-color="#0e2820"/>
    </linearGradient>
    <linearGradient id="cyanBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1c28"/>
      <stop offset="100%" stop-color="#0e2538"/>
    </linearGradient>
    <linearGradient id="purpleBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1238"/>
      <stop offset="100%" stop-color="#28184a"/>
    </linearGradient>
    <linearGradient id="blueBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1838"/>
      <stop offset="100%" stop-color="#10204a"/>
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feFlood flood-color="#ff5070" flood-opacity="0.6"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feFlood flood-color="#3eddaa" flood-opacity="0.45"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feFlood flood-color="#33d4ff" flood-opacity="0.5"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPurple">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feFlood flood-color="#a78bff" flood-opacity="0.5"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feFlood flood-color="#5b8dff" flood-opacity="0.5"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5070"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3eddaa"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bff"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Header -->
  <g transform="translate(40,30)">
    <rect x="0" y="0" width="160" height="32" rx="6" fill="#1e2a4a" stroke="#3a5078" stroke-width="1"/>
    <text x="80" y="22" text-anchor="middle" fill="#9fb0d8" font-size="14" font-weight="600">DICE Compliance SaaS</text>
  </g>

  <text x="800" y="64" text-anchor="middle" font-size="42" font-weight="800" fill="white">
    App <tspan fill="#5b8dff">Architecture</tspan>
  </text>
  <text x="800" y="92" text-anchor="middle" font-size="15" fill="#7a89a8">How every piece of the app connects</text>
  <text x="1560" y="48" text-anchor="end" fill="#6a7a99" font-size="13">@DicebySanyog</text>

  <!-- =================== LAYER 1 — Auth =================== -->
  <text x="40" y="165" fill="#ff7a8a" font-size="14" font-weight="700" letter-spacing="1">LAYER 1 —</text>
  <text x="40" y="190" fill="#ff5070" font-size="22" font-weight="800">Auth Layer</text>

  <g filter="url(#glowRed)">
    <rect x="400" y="135" width="800" height="100" rx="14" fill="url(#redBox)" stroke="#ff5070" stroke-width="2"/>
  </g>
  <g transform="translate(420,150)">
    <!-- Icon -->
    <circle cx="35" cy="35" r="30" fill="#ff5070" opacity="0.15"/>
    <text x="35" y="46" text-anchor="middle" font-size="32" fill="#ff5070">🔐</text>
  </g>
  <text x="495" y="178" fill="#ff5070" font-size="26" font-weight="800">OTP + JWT Auth</text>
  <g transform="translate(495,192)">
    <rect x="0" y="0" width="160" height="22" rx="5" fill="#3a1828" stroke="#ff5070" stroke-width="1"/>
    <text x="80" y="15" text-anchor="middle" fill="#ffb0c0" font-size="11" font-weight="600">custom-built · JWT 15m + refresh 30d</text>
  </g>
  <text x="495" y="232" fill="#e0d0d8" font-size="14">Email OTP (AWS SES)  ·  SMS OTP (MSG91)  ·  TOTP 2FA for admins  ·  Session Mgmt</text>

  <!-- JWT label -->
  <text x="800" y="280" text-anchor="middle" fill="#ff8090" font-size="13" font-weight="700">JWT Token</text>
  <line x1="800" y1="235" x2="800" y2="295" stroke="#ff5070" stroke-width="2" marker-end="url(#arrowRed)"/>
  <!-- branches -->
  <path d="M 800 295 L 800 305 L 360 305 L 360 335" stroke="#ff5070" stroke-width="1.5" fill="none" marker-end="url(#arrowRed)"/>
  <path d="M 800 305 L 1280 305 L 1280 335" stroke="#ff5070" stroke-width="1.5" fill="none" marker-end="url(#arrowRed)"/>

  <!-- =================== LAYER 2 — Data =================== -->
  <text x="40" y="365" fill="#7eecc8" font-size="14" font-weight="700" letter-spacing="1">LAYER 2 —</text>
  <text x="40" y="390" fill="#3eddaa" font-size="22" font-weight="800">Data Layer</text>

  <!-- MongoDB Atlas -->
  <g filter="url(#glowGreen)">
    <rect x="220" y="335" width="380" height="130" rx="14" fill="url(#greenBox)" stroke="#3eddaa" stroke-width="2"/>
  </g>
  <g transform="translate(238,350)">
    <text x="0" y="32" font-size="32">🍃</text>
  </g>
  <text x="285" y="378" fill="#3eddaa" font-size="22" font-weight="800">MongoDB Atlas M2</text>
  <g transform="translate(495,360)">
    <rect width="100" height="20" rx="4" fill="#0f3528" stroke="#3eddaa" stroke-width="1"/>
    <text x="50" y="14" text-anchor="middle" font-size="10" fill="#9eecc8" font-weight="700">Mumbai · PITR</text>
  </g>
  <text x="240" y="404" fill="#bce8d4" font-size="13">users · orgs · products · applications · certifications</text>
  <text x="240" y="424" fill="#bce8d4" font-size="13">documents · document_versions · payments · workflows</text>
  <text x="240" y="444" fill="#bce8d4" font-size="13">notifications · comments · tasks · <tspan fill="#3eddaa" font-weight="700">audit_logs</tspan> (time-series)</text>

  <!-- S3 Storage -->
  <g filter="url(#glowGreen)">
    <rect x="620" y="335" width="380" height="130" rx="14" fill="url(#greenBox)" stroke="#3eddaa" stroke-width="2"/>
  </g>
  <g transform="translate(638,350)">
    <text x="0" y="32" font-size="32">📦</text>
  </g>
  <text x="685" y="378" fill="#3eddaa" font-size="22" font-weight="800">AWS S3</text>
  <g transform="translate(795,360)">
    <rect width="90" height="20" rx="4" fill="#0f3528" stroke="#3eddaa" stroke-width="1"/>
    <text x="45" y="14" text-anchor="middle" font-size="10" fill="#9eecc8" font-weight="700">presigned URLs</text>
  </g>
  <text x="640" y="404" fill="#bce8d4" font-size="13">orgs/{id}/docs/v{n}-file.pdf  (immutable versions)</text>
  <text x="640" y="424" fill="#bce8d4" font-size="13">backups/mongodb/*.tar.gz  (30d/12m/5y retention)</text>
  <text x="640" y="444" fill="#bce8d4" font-size="13">Versioning · Lifecycle: Hot → IA → Glacier · AES-256</text>

  <!-- Three Clients -->
  <g filter="url(#glowCyan)">
    <rect x="1020" y="335" width="380" height="130" rx="14" fill="url(#cyanBox)" stroke="#33d4ff" stroke-width="2"/>
  </g>
  <g transform="translate(1040,350)">
    <text x="0" y="32" font-size="32">🔀</text>
  </g>
  <text x="1090" y="378" fill="#33d4ff" font-size="22" font-weight="800">Three Clients</text>
  <g transform="translate(1280,360)">
    <rect width="100" height="20" rx="4" fill="#0e2538" stroke="#33d4ff" stroke-width="1"/>
    <text x="50" y="14" text-anchor="middle" font-size="10" fill="#a0e0ff" font-weight="700">JWT-authenticated</text>
  </g>
  <text x="1040" y="404" fill="#c0e8f8" font-size="13"><tspan font-size="16">📱</tspan>  Mobile App   <tspan fill="#7090a8" font-size="11">(Expo SDK 54 + RN 0.81)</tspan></text>
  <text x="1040" y="425" fill="#c0e8f8" font-size="13"><tspan font-size="16">💼</tspan>  Admin Portal <tspan fill="#7090a8" font-size="11">(React + Vite)</tspan></text>
  <text x="1040" y="446" fill="#c0e8f8" font-size="13"><tspan font-size="16">🖥️</tspan>  Client Portal <tspan fill="#7090a8" font-size="11">(React + Vite)</tspan></text>

  <!-- Backend node label connecting Layer 2 to Layer 3 -->
  <text x="800" y="510" text-anchor="middle" fill="#3eddaa" font-size="13" font-weight="700">Data + Real-time (Socket.io)</text>
  <line x1="410" y1="465" x2="410" y2="555" stroke="#3eddaa" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="810" y1="465" x2="810" y2="540" stroke="#3eddaa" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <line x1="1210" y1="465" x2="1210" y2="555" stroke="#33d4ff" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- =================== LAYER 3 — State =================== -->
  <text x="40" y="585" fill="#c8b8ff" font-size="14" font-weight="700" letter-spacing="1">LAYER 3 —</text>
  <text x="40" y="610" fill="#a78bff" font-size="22" font-weight="800">State Layer</text>

  <!-- authStore + appStores -->
  <g filter="url(#glowPurple)">
    <rect x="240" y="555" width="450" height="110" rx="14" fill="url(#purpleBox)" stroke="#a78bff" stroke-width="2"/>
  </g>
  <text x="260" y="588" font-size="26">🐻</text>
  <text x="305" y="585" fill="#a78bff" font-size="20" font-weight="800">authStore + applicationStore</text>
  <g transform="translate(605,565)">
    <rect width="70" height="20" rx="4" fill="#28184a" stroke="#a78bff" stroke-width="1"/>
    <text x="35" y="14" text-anchor="middle" font-size="10" fill="#d0c0ff" font-weight="700">Zustand</text>
  </g>
  <text x="260" y="615" fill="#d8d0f0" font-size="13">user · token · refreshToken · org_id · role</text>
  <text x="260" y="635" fill="#d8d0f0" font-size="13">applications: list · filters · kanban view · my tasks</text>
  <text x="260" y="654" fill="#9a89c8" font-size="11">+ certificationStore · notificationStore · bookmarkStore · appStore</text>

  <!-- AdminStore -->
  <g filter="url(#glowPurple)">
    <rect x="720" y="555" width="450" height="110" rx="14" fill="url(#purpleBox)" stroke="#a78bff" stroke-width="2"/>
  </g>
  <text x="740" y="588" font-size="26">🐻</text>
  <text x="785" y="585" fill="#a78bff" font-size="20" font-weight="800">Admin Stores</text>
  <g transform="translate(1085,565)">
    <rect width="70" height="20" rx="4" fill="#28184a" stroke="#a78bff" stroke-width="1"/>
    <text x="35" y="14" text-anchor="middle" font-size="10" fill="#d0c0ff" font-weight="700">Zustand</text>
  </g>
  <text x="740" y="615" fill="#d8d0f0" font-size="13">dashboardStore · userMgmtStore · workflowStore</text>
  <text x="740" y="635" fill="#d8d0f0" font-size="13">auditViewerStore · reportStore · billingStore</text>
  <text x="740" y="654" fill="#9a89c8" font-size="11">isAdmin flag · permissions matrix · org switcher</text>

  <!-- State arrow -->
  <text x="800" y="695" text-anchor="middle" fill="#a78bff" font-size="13" font-weight="700">State</text>
  <line x1="800" y1="665" x2="800" y2="720" stroke="#a78bff" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- =================== LAYER 4 — UI =================== -->
  <text x="40" y="775" fill="#a8c0ff" font-size="14" font-weight="700" letter-spacing="1">LAYER 4 —</text>
  <text x="40" y="800" fill="#5b8dff" font-size="22" font-weight="800">UI Layer</text>

  <!-- 6 UI cards -->
  <g transform="translate(240,735)">
    <g filter="url(#glowBlue)">
      <rect x="0" y="0" width="180" height="100" rx="12" fill="url(#blueBox)" stroke="#5b8dff" stroke-width="2"/>
    </g>
    <text x="14" y="32" fill="white" font-size="22" font-weight="800">Home</text>
    <text x="14" y="55" fill="#a8c0ff" font-size="12">AI Search</text>
    <text x="14" y="73" fill="#7a89c8" font-size="11">compliance status</text>
    <text x="14" y="90" fill="#7a89c8" font-size="11">quick actions</text>
  </g>

  <g transform="translate(440,735)">
    <g filter="url(#glowBlue)">
      <rect x="0" y="0" width="180" height="100" rx="12" fill="url(#blueBox)" stroke="#5b8dff" stroke-width="2"/>
    </g>
    <text x="14" y="32" fill="white" font-size="22" font-weight="800">Applications</text>
    <text x="14" y="55" fill="#a8c0ff" font-size="12">Kanban + List</text>
    <text x="14" y="73" fill="#7a89c8" font-size="11">state machine</text>
    <text x="14" y="90" fill="#7a89c8" font-size="11">notify on change</text>
  </g>

  <g transform="translate(640,735)">
    <g filter="url(#glowBlue)">
      <rect x="0" y="0" width="180" height="100" rx="12" fill="url(#blueBox)" stroke="#5b8dff" stroke-width="2"/>
    </g>
    <text x="14" y="32" fill="white" font-size="22" font-weight="800">Certificates</text>
    <text x="14" y="55" fill="#a8c0ff" font-size="12">Lifecycle</text>
    <text x="14" y="73" fill="#7a89c8" font-size="11">expiry alerts</text>
    <text x="14" y="90" fill="#7a89c8" font-size="11">renewal chain</text>
  </g>

  <g transform="translate(840,735)">
    <g filter="url(#glowBlue)">
      <rect x="0" y="0" width="180" height="100" rx="12" fill="url(#blueBox)" stroke="#5b8dff" stroke-width="2"/>
    </g>
    <text x="14" y="32" fill="white" font-size="22" font-weight="800">Documents</text>
    <text x="14" y="55" fill="#a8c0ff" font-size="12">S3 + Versions</text>
    <text x="14" y="73" fill="#7a89c8" font-size="11">presigned upload</text>
    <text x="14" y="90" fill="#7a89c8" font-size="11">OCR + AI</text>
  </g>

  <g transform="translate(1040,735)">
    <g filter="url(#glowBlue)">
      <rect x="0" y="0" width="180" height="100" rx="12" fill="url(#blueBox)" stroke="#5b8dff" stroke-width="2"/>
    </g>
    <text x="14" y="32" fill="white" font-size="22" font-weight="800">Insights + AI</text>
    <text x="14" y="55" fill="#a8c0ff" font-size="12">GPT-4o Chat</text>
    <text x="14" y="73" fill="#7a89c8" font-size="11">reg. updates</text>
    <text x="14" y="90" fill="#7a89c8" font-size="11">bookmarks</text>
  </g>

  <g transform="translate(1240,735)">
    <g filter="url(#glowBlue)">
      <rect x="0" y="0" width="180" height="100" rx="12" fill="url(#blueBox)" stroke="#5b8dff" stroke-width="2"/>
    </g>
    <!-- lock chip -->
    <g transform="translate(150,8)">
      <rect width="22" height="22" rx="5" fill="#ff5070"/>
      <text x="11" y="17" text-anchor="middle" font-size="13">🔒</text>
    </g>
    <text x="14" y="32" fill="white" font-size="22" font-weight="800">Admin</text>
    <text x="14" y="55" fill="#a8c0ff" font-size="12">Audit + Mgmt</text>
    <text x="14" y="73" fill="#7a89c8" font-size="11">time-series logs</text>
    <text x="14" y="90" fill="#7a89c8" font-size="11">admin only 🔒</text>
  </g>

  <!-- Router connector arc -->
  <path d="M 330 845 Q 800 880 1330 845" stroke="#5b8dff" stroke-width="2" fill="none" stroke-dasharray="6,4"/>
  <text x="800" y="887" text-anchor="middle" fill="#a8c0ff" font-size="13" font-weight="700">React Navigation 6 (mobile)  ·  React Router (admin)</text>

  <!-- Footer note -->
  <text x="40" y="970" fill="#6a7a99" font-size="12">Every screen connects through these 4 layers · ₹3,000/month at 5k DAU</text>

  <!-- Tech badges -->
  <g transform="translate(960,950)">
    <g transform="translate(0,0)">
      <rect width="115" height="26" rx="13" fill="#1a2540" stroke="#5b8dff" stroke-width="1.5"/>
      <text x="57" y="18" text-anchor="middle" fill="#5b8dff" font-size="12" font-weight="700">Expo SDK 54</text>
    </g>
    <g transform="translate(125,0)">
      <rect width="140" height="26" rx="13" fill="#1a3540" stroke="#33d4ff" stroke-width="1.5"/>
      <text x="70" y="18" text-anchor="middle" fill="#33d4ff" font-size="12" font-weight="700">React Native 0.81</text>
    </g>
    <g transform="translate(275,0)">
      <rect width="120" height="26" rx="13" fill="#2a1840" stroke="#a78bff" stroke-width="1.5"/>
      <text x="60" y="18" text-anchor="middle" fill="#a78bff" font-size="12" font-weight="700">MongoDB M2</text>
    </g>
    <g transform="translate(405,0)">
      <rect width="100" height="26" rx="13" fill="#102a20" stroke="#3eddaa" stroke-width="1.5"/>
      <text x="50" y="18" text-anchor="middle" fill="#3eddaa" font-size="12" font-weight="700">TypeScript</text>
    </g>
    <g transform="translate(515,0)">
      <rect width="100" height="26" rx="13" fill="#3a1828" stroke="#ff5070" stroke-width="1.5"/>
      <text x="50" y="18" text-anchor="middle" fill="#ff5070" font-size="12" font-weight="700">AWS Mumbai</text>
    </g>
  </g>
</svg>
