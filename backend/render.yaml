services:
  - type: web
    name: sanyog-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: sanyog-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sanyog-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://app.sanyogconformity.com
      - key: ADMIN_URL
        value: https://admin.sanyogconformity.com
      # User must set these manually in Render dashboard:
      - key: OPENAI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: AWS_S3_BUCKET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  - type: redis
    name: sanyog-redis
    plan: free
    ipAllowList: []

databases:
  - name: sanyog-db
    plan: free
    databaseName: sanyog_conformity
    user: sanyog
