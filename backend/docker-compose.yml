# One-command production-like stack: API + Postgres + Redis
# Usage:
#   cp .env.example .env  (fill in OPENAI_API_KEY, AWS keys, Razorpay)
#   docker compose up -d
# API ready at http://localhost:5000
version: "3.9"

services:
  api:
    build: .
    container_name: sanyog-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://sanyog:${DB_PASSWORD:-sanyog_secure_pass}@postgres:5432/sanyog_conformity
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too-min-32-chars}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-sanyog-conformity-docs}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: sanyog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sanyog
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sanyog_secure_pass}
      POSTGRES_DB: sanyog_conformity
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/db/schema_additions.sql:/docker-entrypoint-initdb.d/02-additions.sql:ro
      - ./src/db/seed.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sanyog -d sanyog_conformity"]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sanyog-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  uploads:
