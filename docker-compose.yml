# Full stack: API + Admin Dashboard + MongoDB + Redis
# Usage:
#   cp backend/.env.example backend/.env  (fill in secrets)
#   docker compose up -d
# API: http://localhost:5000   Admin: http://localhost:3001
version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: sanyog_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sanyog_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sanyog_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/sanyog_conformity
      REDIS_URL: redis://redis:6379
    env_file:
      - ./backend/.env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: sanyog_admin
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
